<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Mode | Study Uprise</title>
    <link href="../css/main.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script> 
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script> 
    <script>
        const firebaseConfig = {
            apiKey: "your-api-key",
            authDomain: "your-auth-domain",
            projectId: "study-uprise-id",
            storageBucket: "your-storage-bucket",
            messagingSenderId: "sender-id",
            appId: "your-app-id"
        };
        firebase.initializeApp(firebaseConfig);
    </script>
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-100 font-[Inter] min-h-screen">

    <header class="bg-white shadow-sm border-b border-slate-200">
        <nav class="max-w-4xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-graduation-cap text-indigo-600 text-xl"></i>
                <span class="font-bold text-slate-800">Quiz Mode</span>
            </div>
            <a href="./summarizer.html" class="text-sm font-medium text-slate-500 hover:text-indigo-600">Exit Quiz</a>
        </nav>
    </header>

    <main class="max-w-3xl mx-auto p-6 mt-8">
        
        <!-- Loading -->
        <div id="loading-container" class="text-center py-20">
            <div class="w-16 h-16 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mx-auto mb-6"></div>
            <h2 class="text-2xl font-bold text-slate-800">Generating Questions...</h2>
            <p class="text-slate-500 mt-2">Analyzing your document to create a custom test.</p>
        </div>

        <!-- Quiz Card -->
        <div id="quiz-container" class="hidden bg-white rounded-2xl shadow-lg border border-slate-100 overflow-hidden">
            <div class="bg-indigo-600 p-6 text-white flex justify-between items-center">
                <h2 class="text-xl font-bold">Knowledge Check</h2>
                <span id="score-display" class="hidden bg-white/20 px-4 py-1 rounded-full text-sm font-bold backdrop-blur-sm">Score: 0/0</span>
            </div>

            <div class="p-8">
                <form id="quiz-form" class="space-y-8">
                    <div id="questions-list" class="space-y-8">
                        <!-- Questions injected here -->
                    </div>

                    <div class="pt-6 border-t border-slate-100">
                        <button type="submit" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 transition transform hover:scale-[1.01]">
                            Submit Answers
                        </button>
                    </div>
                </form>
                
                <button id="retry-button" class="hidden w-full mt-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition">
                    <i class="fa-solid fa-rotate-right mr-2"></i> Generate New Quiz
                </button>
            </div>
        </div>

    </main>

    <script src="../js/quiz.js"></script>
</body>
</html>
