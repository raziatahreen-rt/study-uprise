<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watching Playlist | Study Uprise</title>
    <link href="../css/main.css" rel="stylesheet"> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script> 
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script> 
    <!-- ADD FIRESTORE SCRIPT -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "your-api-key",
            authDomain: "your-auth-domain",
            projectId: "study-uprise-id",
            storageBucket: "your-storage-bucket",
            messagingSenderId: "sender-id",
            appId: "your-app-id"
        };
        firebase.initializeApp(firebaseConfig);
    </script>
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-900 font-[Inter] text-white">
    
    <!-- Dark Navbar for Cinema Mode -->
    <header class="bg-slate-800 border-b border-slate-700">
        <nav class="max-w-screen-2xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-play-circle text-indigo-500 text-xl"></i>
                <span class="font-bold text-lg">Study Uprise Player</span>
            </div>
            <div>
                <a href="./dashboard.html" class="text-slate-300 hover:text-white text-sm font-medium flex items-center">
                    <i class="fa-solid fa-arrow-left mr-2"></i> Back to Dashboard
                </a>
            </div>
        </nav>
    </header>

    <main class="max-w-screen-2xl mx-auto p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6 h-[calc(100vh-64px)]">
        
        <!-- Video Player (Takes up 3 cols) -->
        <div class="lg:col-span-3 flex flex-col">
            <div class="relative w-full pt-[56.25%] bg-black rounded-xl overflow-hidden shadow-2xl border border-slate-700">
                <iframe 
                    id="main-video-player"
                    class="absolute top-0 left-0 w-full h-full"
                    src="" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen
                ></iframe>
            </div>
            <div class="mt-4">
                <h2 id="main-video-title" class="text-2xl font-bold text-white">Loading...</h2>
            </div>
        </div>

        <!-- Queue Sidebar (Takes up 1 col) -->
        <div class="lg:col-span-1 bg-slate-800 rounded-xl border border-slate-700 flex flex-col overflow-hidden h-full max-h-[80vh]">
            <div class="p-4 border-b border-slate-700 bg-slate-800">
                <h3 id="playlist-title" class="font-bold text-slate-200">Up Next</h3>
            </div>
            <div id="video-queue-container" class="flex-1 overflow-y-auto p-2 space-y-2">
                <!-- Items injected here via JS -->
                <p class="text-slate-500 text-center p-4">Loading queue...</p>
            </div>
        </div>

    </main>

    <!-- LINK TO PLAYLIST JS (NOT DASHBOARD JS) -->
    <script src="../js/playlist.js"></script>
</body>
</html>
