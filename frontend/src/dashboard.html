<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Study Uprise</title>
    <link href="../css/main.css" rel="stylesheet"> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Scripts (Keep your existing firebase config) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script> 
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script> 
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script> 
    
    <script>
        const firebaseConfig = {
            apiKey: "your-api-key",
            authDomain: "your-auth-domain",
            projectId: "study-uprise-id",
            storageBucket: "your-storage-bucket",
            messagingSenderId: "sender-id",
            appId: "your-app-id"
        };
        firebase.initializeApp(firebaseConfig);
    </script>

    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen">
    
    <!-- Navbar (Same structure as Index) -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-brain text-indigo-600 text-xl"></i>
                    <span class="text-xl font-bold text-slate-800">Study Uprise</span>
                </div>
                <div class="flex items-center gap-4">
                    <a href="./index.html" class="text-slate-500 hover:text-indigo-600 text-sm font-medium">Home</a>
                    <!-- NEW LINK ADDED HERE -->
                    <a href="./summarizer.html" class="text-slate-500 hover:text-indigo-600 text-sm font-medium">Summarizer</a>
                    
                    <span id="dashboard-user-info" class="text-slate-400 text-sm border-l pl-4 border-slate-200">Loading...</span>
                    <button id="logout-button" class="text-red-500 hover:text-red-700 text-sm font-medium ml-2">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <!-- Welcome Section -->
        <div class="mb-10">
            <h1 class="text-3xl font-bold text-slate-900">Your Learning Dashboard</h1>
            <p class="text-slate-500 mt-1">Track your progress and manage your saved content.</p>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
            <!-- Stat 1 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-slate-500 text-sm font-medium">Saved Playlists</p>
                    <p id="stat-total-playlists" class="text-4xl font-bold text-indigo-600 mt-2">0</p>
                </div>
                <div class="w-12 h-12 bg-indigo-50 rounded-full flex items-center justify-center text-indigo-600 text-xl">
                    <i class="fa-solid fa-bookmark"></i>
                </div>
            </div>
            <!-- Stat 2 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-slate-500 text-sm font-medium">Completed</p>
                    <p id="stat-topics-completed" class="text-4xl font-bold text-emerald-600 mt-2">0</p>
                </div>
                <div class="w-12 h-12 bg-emerald-50 rounded-full flex items-center justify-center text-emerald-600 text-xl">
                    <i class="fa-solid fa-check-circle"></i>
                </div>
            </div>
            <!-- Stat 3 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-slate-500 text-sm font-medium">In Progress</p>
                    <p id="stat-in-progress" class="text-4xl font-bold text-amber-500 mt-2">0</p>
                </div>
                <div class="w-12 h-12 bg-amber-50 rounded-full flex items-center justify-center text-amber-500 text-xl">
                    <i class="fa-solid fa-spinner"></i>
                </div>
            </div>
        </div>

        <!-- Playlists -->
        <section>
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-slate-800">My Playlists</h2>
                <a href="./index.html" class="text-indigo-600 hover:text-indigo-700 text-sm font-medium">+ Add New</a>
            </div>
            
            <div id="playlists-container" class="grid grid-cols-1 gap-6">
                <!-- Cards will be injected here with updated styling -->
                <div class="text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300">
                    <p class="text-slate-400">Loading your content...</p>
                </div>
            </div>
        </section>

    </main>

    <script src="../js/dashboard.js"></script>
</body>
</html>
